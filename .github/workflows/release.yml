name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build macOS app
        run: |
          cd apps/macos
          SIGN_APP=0 ./scripts/package-app.sh

      - name: Zip macOS app
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent apps/macos/dist/VoiSER.app artifacts/VoiSER-macOS.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiSER-macOS
          path: artifacts/VoiSER-macOS.zip

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: microsoft/setup-msbuild@v2

      - name: Restore and test
        continue-on-error: true
        shell: pwsh
        run: |
          Set-Location apps/windows
          dotnet restore tests/VoiSER.Windows.Tests/VoiSER.Windows.Tests.csproj
          dotnet test tests/VoiSER.Windows.Tests/VoiSER.Windows.Tests.csproj -c Release --no-restore

      - name: Build Windows app
        shell: pwsh
        run: |
          Set-Location apps/windows
          $artifacts = Join-Path (Get-Location) "artifacts"
          New-Item -ItemType Directory -Force -Path $artifacts | Out-Null

          $log = Join-Path $artifacts "build-windows.log"

          $output = & msbuild .\src\VoiSER.Windows.App\VoiSER.Windows.App.csproj /t:Restore,Build /p:Configuration=Release /p:Platform=x64 /p:WindowsPackageType=None /p:EnableMsixTooling=false /p:GenerateAppxPackageOnBuild=false 2>&1
          $exitCode = $LASTEXITCODE

          $output | Tee-Object -FilePath $log

          if ($exitCode -ne 0) {
            $tail = Get-Content $log -Tail 80
            foreach ($line in $tail) {
              $msg = $line.ToString().Replace("`r", " ").Replace("`n", " ")
              Write-Host "::error title=Build Windows app::$msg"
            }

            throw "Build Windows app failed with exit code $exitCode"
          }

      - name: Build portable zip
        shell: pwsh
        run: |
          Set-Location apps/windows

          $artifacts = Join-Path (Get-Location) "artifacts"
          New-Item -ItemType Directory -Force -Path $artifacts | Out-Null

          $portableDir = Join-Path $artifacts "portable"
          if (Test-Path $portableDir) {
            Remove-Item -Recurse -Force $portableDir
          }
          New-Item -ItemType Directory -Path $portableDir | Out-Null

          $buildRoot = Join-Path (Get-Location) "src/VoiSER.Windows.App/bin/Release"
          $exe = Get-ChildItem -Path $buildRoot -Recurse -Filter "VoiSER.Windows.App.exe" -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($null -eq $exe) {
            throw "Built app executable was not found under $buildRoot"
          }

          Copy-Item -Path (Join-Path $exe.Directory.FullName "*") -Destination $portableDir -Recurse -Force

          $portableZip = Join-Path $artifacts "VoiSER-Windows-portable.zip"
          if (Test-Path $portableZip) {
            Remove-Item -Force $portableZip
          }
          Compress-Archive -Path (Join-Path $portableDir "*") -DestinationPath $portableZip

      - name: Validate portable zip
        shell: pwsh
        run: |
          Set-Location apps/windows
          $portable = Join-Path (Get-Location) "artifacts/VoiSER-Windows-portable.zip"
          if (!(Test-Path $portable)) {
            throw "Portable ZIP was not produced: $portable"
          }

          $size = (Get-Item $portable).Length
          if ($size -lt 102400) {
            throw "Portable ZIP is unexpectedly small ($size bytes), aborting release."
          }

      - name: Build MSIX (best effort)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Set-Location apps/windows
          $out = Join-Path (Get-Location) "artifacts/msix"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          dotnet msbuild .\src\VoiSER.Windows.App\VoiSER.Windows.App.csproj /t:Restore,Build /p:Configuration=Release /p:GenerateAppxPackageOnBuild=true /p:AppxBundle=Never /p:AppxPackageDir="$out\\" || $true

          $msix = Get-ChildItem -Path $out -Recurse -Include *.msix,*.appx -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -ne $msix) {
            Compress-Archive -Path $msix.FullName -DestinationPath (Join-Path (Get-Location) "artifacts/VoiSER-Windows-msix.zip") -Force
          }
          else {
            "MSIX build artifact was not produced on this runner." | Out-File -Encoding utf8 (Join-Path (Get-Location) "artifacts/MSIX-NOTICE.txt")
            Compress-Archive -Path (Join-Path (Get-Location) "artifacts/MSIX-NOTICE.txt") -DestinationPath (Join-Path (Get-Location) "artifacts/VoiSER-Windows-msix.zip") -Force
          }

      - name: Ensure MSIX zip exists
        if: always()
        shell: pwsh
        run: |
          Set-Location apps/windows
          $artifacts = Join-Path (Get-Location) "artifacts"
          New-Item -ItemType Directory -Force -Path $artifacts | Out-Null
          $msixZip = Join-Path (Get-Location) "artifacts/VoiSER-Windows-msix.zip"
          if (!(Test-Path $msixZip)) {
            "MSIX package was not produced on this runner." | Out-File -Encoding utf8 (Join-Path (Get-Location) "artifacts/MSIX-NOTICE.txt")
            Compress-Archive -Path (Join-Path (Get-Location) "artifacts/MSIX-NOTICE.txt") -DestinationPath $msixZip -Force
          }

      - name: Upload Windows portable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoiSER-Windows-portable
          path: apps/windows/artifacts/VoiSER-Windows-portable.zip

      - name: Upload Windows msix artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoiSER-Windows-msix
          path: apps/windows/artifacts/VoiSER-Windows-msix.zip

  publish-github-release:
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-release

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/VoiSER-macOS/VoiSER-macOS.zip
            dist-release/VoiSER-Windows-portable/VoiSER-Windows-portable.zip
            dist-release/VoiSER-Windows-msix/VoiSER-Windows-msix.zip
          generate_release_notes: true
          body: |
            ## VoiSER Multi-platform Release

            - macOS artifact: `VoiSER-macOS.zip`
            - Windows portable: `VoiSER-Windows-portable.zip`
            - Windows package: `VoiSER-Windows-msix.zip`
