name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build macOS app
        run: |
          cd apps/macos
          SIGN_APP=0 ./scripts/package-app.sh

      - name: Zip macOS app
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent apps/macos/dist/VoiSER.app artifacts/VoiSER-macOS.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiSER-macOS
          path: artifacts/VoiSER-macOS.zip

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: microsoft/setup-msbuild@v2

      - name: Restore and test
        continue-on-error: true
        shell: pwsh
        run: |
          Set-Location apps/windows
          dotnet restore tests/VoiSER.Windows.Tests/VoiSER.Windows.Tests.csproj
          dotnet test tests/VoiSER.Windows.Tests/VoiSER.Windows.Tests.csproj -c Release --no-restore

      - name: Build portable zip
        shell: pwsh
        run: |
          Set-Location apps/windows
          ./scripts/package-windows.ps1

      - name: Validate portable zip
        shell: pwsh
        run: |
          Set-Location apps/windows
          $portable = Join-Path (Get-Location) "artifacts/VoiSER-Windows-portable.zip"
          if (!(Test-Path $portable)) {
            throw "Portable ZIP was not produced: $portable"
          }

          $size = (Get-Item $portable).Length
          if ($size -lt 31457280) {
            throw "Portable ZIP is too small for self-contained build ($size bytes), aborting release."
          }

          $extract = Join-Path $env:RUNNER_TEMP "portable-validate"
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -Path $portable -DestinationPath $extract -Force

          $runtimeMarker = Join-Path $extract "Microsoft.WindowsAppRuntime.dll"
          if (!(Test-Path $runtimeMarker)) {
            throw "Portable ZIP is missing Microsoft.WindowsAppRuntime.dll (self-contained runtime not included)."
          }

      - name: Build MSIX package
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          Set-Location apps/windows
          ./scripts/package-msix.ps1

      - name: Validate MSIX zip
        shell: pwsh
        run: |
          Set-Location apps/windows
          $msixZip = Join-Path (Get-Location) "artifacts/VoiSER-Windows-msix.zip"
          if (!(Test-Path $msixZip)) {
            throw "MSIX ZIP was not produced: $msixZip"
          }

          $zipSize = (Get-Item $msixZip).Length
          if ($zipSize -lt 51200) {
            throw "MSIX ZIP is unexpectedly small ($zipSize bytes), aborting release."
          }

          $extract = Join-Path $env:RUNNER_TEMP "msix-validate"
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -Path $msixZip -DestinationPath $extract -Force

          $msix = Get-ChildItem -Path $extract -Recurse -Include *.msix,*.appx,*.msixbundle -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $msix) {
            throw "MSIX ZIP does not contain a real package file (*.msix/*.appx/*.msixbundle)."
          }

          if ($msix.Length -lt 102400) {
            throw "MSIX package is unexpectedly small ($($msix.Length) bytes), aborting release."
          }

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiSER-Windows-portable
          path: apps/windows/artifacts/VoiSER-Windows-portable.zip

      - name: Upload Windows msix artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiSER-Windows-msix
          path: apps/windows/artifacts/VoiSER-Windows-msix.zip

  publish-github-release:
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-release

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/VoiSER-macOS/VoiSER-macOS.zip
            dist-release/VoiSER-Windows-portable/VoiSER-Windows-portable.zip
            dist-release/VoiSER-Windows-msix/VoiSER-Windows-msix.zip
          generate_release_notes: true
          body: |
            ## VoiSER Multi-platform Release

            - macOS artifact: `VoiSER-macOS.zip`
            - Windows portable: `VoiSER-Windows-portable.zip`
            - Windows package: `VoiSER-Windows-msix.zip`
