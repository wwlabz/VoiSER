name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Swift test (macOS)
        if: runner.os == 'macOS'
        run: |
          cd apps/macos
          swift test

      - name: Swift release build (macOS)
        if: runner.os == 'macOS'
        run: |
          cd apps/macos
          swift build -c release --product VoiSER

      - name: Dotnet restore (Windows)
        if: runner.os == 'Windows'
        run: |
          cd apps/windows
          dotnet restore tests/VoiSER.Windows.Tests/VoiSER.Windows.Tests.csproj

      - name: Dotnet test (Windows)
        if: runner.os == 'Windows'
        run: |
          cd apps/windows
          dotnet test tests/VoiSER.Windows.Tests/VoiSER.Windows.Tests.csproj -c Release --no-restore

      - name: Dotnet build app (Windows)
        if: runner.os == 'Windows'
        run: |
          cd apps/windows
          dotnet build src/VoiSER.Windows.App/VoiSER.Windows.App.csproj -c Release
